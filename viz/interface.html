<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silent Signals · Network simulator</title>
<style>
:root{color-scheme:dark;--bg:#0a0d12;--panel:#141b23ed;--line:#2c3741;--ink:#eef3f0;--mut:#a0afaF;--cyan:#51decf;--gold:#f5b44e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'Segoe UI',Arial,sans-serif;font-variant-numeric:tabular-nums}button,select,input{font:inherit;color:inherit}button,select,input[type=number]{background:#1a242e;border:1px solid var(--line);border-radius:6px;padding:7px 10px}button{cursor:pointer}button:hover,button:focus-visible,select:focus-visible{border-color:var(--cyan)}input[type=range]{accent-color:var(--cyan);min-width:0}header{height:76px;display:flex;align-items:center;gap:15px;padding:0 23px;border-bottom:1px solid var(--line)}h1{font-size:22px;letter-spacing:-.7px;margin:0}header p{color:var(--mut);margin:2px 0 0;font-size:12px}.logo{color:var(--cyan);font:30px monospace}.spacer{flex:1}.work{height:calc(100dvh - 76px);display:grid;grid-template-rows:minmax(0,1fr) auto}.body{min-height:0;display:flex}.drawer{width:247px;background:var(--panel);border-right:1px solid var(--line);padding:16px;overflow-y:auto;flex:none;transition:width .18s,padding .18s}.drawer.right{width:235px;border-right:0;border-left:1px solid var(--line)}.drawer.closed{width:0;padding:0;overflow:hidden;border:0}.drawer h2{font-size:14px;margin:0 0 16px}.drawer h3{font-size:12px;color:var(--mut);margin:18px 0 8px}.field{margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:5px;align-items:center}.field label{color:var(--mut);font-size:12px}.field input[type=range],.field select{grid-column:1/-1;width:100%}.field output{font:11px Consolas,monospace}input[type=number]{width:90px}.row{display:flex;gap:6px;align-items:center}.minor{color:var(--mut);font-size:11px}.stage{position:relative;flex:1;min-width:0;background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:24px 24px}canvas{height:100%;width:100%;display:block;touch-action:none}.over{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.over button{pointer-events:auto}.legend{position:absolute;bottom:12px;left:12px;background:#10171eea;padding:7px 10px;border-radius:5px;font-size:11px;pointer-events:none}.gold{color:var(--gold)}.aqua{color:var(--cyan)}#tip{position:absolute;white-space:pre-line;display:none;background:#111a22f7;border:1px solid var(--line);border-radius:5px;padding:8px;pointer-events:none;font:11px Consolas,monospace}.tele{margin-bottom:14px}.tele b{font-size:15px}.tele dl{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:11px}.tele dt{color:var(--mut)}.tele dd{margin:0;text-align:right}.ticker{font:10px/1.6 Consolas,monospace;color:var(--mut)}footer{border-top:1px solid var(--line);padding:10px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}#play{background:var(--cyan);color:#082320;font-weight:600}#timeline{flex:1}#clock{font:12px Consolas,monospace}#status{font-size:12px;color:var(--cyan)}.file{display:inline-block;cursor:pointer;font-size:12px;border-bottom:1px solid #65777b;margin-top:8px}.file input{display:none}@media(max-width:950px){.drawer{width:192px}.drawer.right{width:178px}header{padding:0 12px}.legend{font-size:9px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><header><span class="logo" aria-hidden="true">⌁</span><div><h1>Silent Signals</h1><p>Wireless sensor election simulator</p></div><span class="spacer"></span><span id="status" role="status"></span><button id="compare">Compare</button><button id="reset">Reset</button></header>
<main class="work"><div class="body"><aside class="drawer" id="left"><h2>Deployment</h2>
<div class="field"><label for="topo">Network shape</label><select id="topo"><option value="rgg">Geometric</option><option value="grid">Grid</option><option value="sparse">Sparse geometric</option><option value="tree">Tree</option><option value="clustered">Clustered</option></select></div>
<div class="field"><label for="size">Sensors</label><output id="nVal"></output><input id="size" type="range" min="10" max="400" value="100"></div>
<div class="field"><label for="degree">Target degree</label><output id="dVal"></output><input id="degree" type="range" min="3" max="16" value="8"></div>
<div class="field"><label for="seed">Seed</label><div class="row"><input type="number" id="seed" value="0" min="0"><button id="dice" title="New seed">⚄</button></div></div>
<h3>Election</h3><div class="field"><label for="protocol">Protocol</label><select id="protocol"></select></div>
<div class="field" id="otherField" hidden><label for="other">Compare with</label><select id="other"></select></div>
<div class="field"><label for="view">Stop after</label><select id="view"><option value="election">Election only</option><option value="setup">Full setup</option></select></div>
<div class="field"><label for="loss">Beep / packet loss</label><output id="lVal"></output><input id="loss" type="range" min="0" max=".3" step=".01" value="0"></div>
<div class="field"><label for="het">Battery variation</label><output id="hVal"></output><input id="het" type="range" min="0" max="1" step=".01" value="0"></div>
<div class="field"><label for="radio">Sender feedback</label><select id="radio"><option value="ideal">Ideal</option><option value="emulated">Half-duplex · 4 pairs</option></select></div>
<div class="field"><label for="repeat">Afek repetition M</label><select id="repeat"><option>1</option><option>2</option><option>4</option></select></div>
<label class="minor"><input type="checkbox" id="senders"> Show observer-only sender IDs</label></aside>
<section class="stage"><canvas id="cv" aria-label="Wireless network"></canvas><div class="over"><button id="controls">Controls</button><div><button id="fit">Fit</button> <button id="metrics">Readings</button></div></div><div class="legend"><span class="gold">◆</span> Head　<span class="aqua">◎</span> Transmitting　○ Undecided　● Covered　× Dead</div><div id="tip"></div></section>
<aside class="drawer right" id="right"><h2>Network readings</h2><div id="readings"></div><h3>Last six transitions</h3><div class="ticker" id="ticker"></div><h3>Trace</h3><div class="row"><button id="csv">CSV</button><button id="json">JSON</button></div><label class="file">Replay Python trace<input id="import" type="file" accept=".json"></label></aside></div>
<footer><button id="play">▶ Play</button><button id="one">+1 slot</button><button id="ten">+10</button><span id="clock"></span><input id="timeline" aria-label="Rewind timeline" type="range" min="0" value="0"><label for="speed">Speed</label><input id="speed" aria-label="Slots per second" type="range" min="1" max="100" value="12"><output id="speedVal">12/s</output></footer></main>
<script>/*__ENGINE__*/</script></html>
